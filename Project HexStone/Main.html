<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hexapod</title>
		<link rel="stylesheet" href="styling.css" />

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"ImportControls": "../examples/jsm/controls/OrbitControls.js",
					"ImportMath": "../src/math/MathUtils.js",
					"three/addons/": "../examples/jsm/",
					"ImportMeshline": "../THREE.MeshLine-master/THREE.MeshLine-master/src/THREE.MeshLine.js"
				}
			}
		</script>

		<script type="module">
			// ------------------------------------------------
			// BASIC SETUP
			// ------------------------------------------------

			import * as THREE from "three";
			import { OrbitControls } from "ImportControls";
			import { MathUtils } from "ImportMath";
			import { GUI } from "three/addons/libs/lil-gui.module.min.js";

			let camera, scene, renderer;

			init();

			// ------------------------------------------------
			// General Global Variables
			// ------------------------------------------------

			let debug = false; // Enable to print Debug info to console (Doesnt do much yet)

			// Set to true after the first loop of the program.
			// this is purly for visual purposes
			let firstLoop = false;

			// ------------------------------------------------
			// Global Paramerters
			// ------------------------------------------------

			// Initialize leg parameters and variables
			let femur, tibia, hip, knee, foot, endPoint, pivot;
			const coxaLen = 1;
			const femurLen = 5;
			const tibiaLen = 5;
			const numLegs = 6;
			let legGroups = [],
				legParts = [],
				goals = [];
			let hipStance = [
				[12, 10],
				[18, 0],
				[12, -10],
			];

			// Runtime Variables
			let hipWorldPos;
			let goalWorldPos = [0, 0, 0, 0, 0, 0];
			let jointAngles = [];

			// ------------------------------------------------
			// Setup Functions
			// ------------------------------------------------

			function init() {
				console.clear();

				// Initialize the camera, scene, and renderer
				camera = new THREE.PerspectiveCamera(
					75,
					window.innerWidth / window.innerHeight,
					0.1,
					1000
				);

				camera.position.set(35, 20, 30);

				scene = new THREE.Scene();

				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setClearColor("#2c354d");
				renderer.setSize(window.innerWidth, window.innerHeight);
				document.body.appendChild(renderer.domElement);

				const controls = new OrbitControls(camera, renderer.domElement);

				window.addEventListener("resize", onWindowResize);

				setupScene();
				setupControlPannel();
			}

			function onWindowResize() {
				// Updates window aspect ratio on resize
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);
			}

			function setupScene() {
				// Setup for all Enviromental Features
				const light1 = new THREE.AmbientLight({ color: "#ffffff" });
				const light2 = new THREE.DirectionalLight({ color: "#ffffff" }, 5);
				light2.position.set(3, 9, 0);

				scene.add(light1);
				scene.add(light2);

				const size = 100;
				const divisions = 100;
				const gridColor = new THREE.Color("rgb(75, 75, 75)");
				const centerColor = new THREE.Color("rgb(75, 25, 50)");

				const gridHelper = new THREE.GridHelper(
					size,
					divisions,
					centerColor,
					gridColor
				);
				scene.add(gridHelper);

				const axesHelper = new THREE.AxesHelper(5);
				axesHelper.position.y += 0.005;
				scene.add(axesHelper);
			}

			function setupControlPannel() {
				// Initializes the Control Pannel
				const panel = new GUI({ width: 310 });

				let settings;

				const folder1 = panel.addFolder("Debug");
				const folder2 = panel.addFolder("Motion");
				const folder3 = panel.addFolder("Size Parameters");
				let t = 1;

				settings = {
					Model: true,
					"Stability Polygon": true,
					"Animate Model": true,
					"Debug Object": false,
					"Debug Object Position": 0,
					"Path Visualizer": true,
					"Path Visualizer Position": 0,
					"Chassis Height": 3.5,
					"Step Length": 5,
					"Step Height": 4,
					"Straif Angle": 0,
					"Turn Threshold": 0,
					"Joint Diameter": 0.5,
					"Leg Diameter": 0.25,
					"Endpoint Diameter": 0.1,
				};

				folder1
					.add(settings, "Model")
					.listen()
					.onChange(function (bool) {
						for (let i = 0; i < 6; i++) {
							legGroups[i][2].visible = bool;
						}
					});
				folder1
					.add(settings, "Stability Polygon")
					.listen()
					.onChange(function (bool) {
						bool
							? (currentGait.stabMesh.material.opacity = 0.35)
							: (currentGait.stabMesh.material.opacity = 0);
					});
				folder1
					.add(settings, "Debug Object")
					.listen()
					.onChange(function (bool) {
						bool
							? (currentGait.debugShape.material.opacity = 1)
							: (currentGait.debugShape.material.opacity = 0);
					});
				folder1
					.add(settings, "Debug Object Position", 0, 5, 1)
					.listen()
					.onChange(function (val) {
						currentGait.debugShapePos = val;
					});
				folder1
					.add(settings, "Path Visualizer")
					.listen()
					.onChange(function (val) {
						val == false ? footVisualizer.hide() : footVisualizer.show();
					});
				folder1
					.add(settings, "Path Visualizer Position", 0, 5, 1)
					.listen()
					.onChange(function (val) {
						footVisualizer.changeObject(legParts[val][5]);
					});
				folder2
					.add(settings, "Animate Model")
					.listen()
					.onChange(function (bool) {
						animateModel = bool;
					});
				folder2
					.add(settings, "Chassis Height", 0, 10, 0.1)
					.listen()
					.onChange(function (val) {
						chassisHeight = val;
						for (let i = 0; i < 6; i++) {
							legGroups[i][2].position.y = chassisHeight;
						}
					});
				folder2
					.add(settings, "Step Length", 2, 8, 0.1)
					.listen()
					.onChange(function (val) {
						rippleGait.stepDis = val;
					});
				folder2
					.add(settings, "Step Height", 0, 8, 0.1)
					.listen()
					.onChange(function (val) {
						rippleGait.stepHeight = val;
					});
				folder2
					.add(settings, "Straif Angle", -90, 90, 1)
					.listen()
					.onChange(function (val) {
						rippleGait.straifAngle = MathUtils.degToRad(val);
					});
				folder2
					.add(settings, "Turn Threshold", -100, 100, 1)
					.listen()
					.onChange(function (val) {
						rippleGait.turnPoint.x = val;
						rippleGait.turnThreshold = val;
						centerPoint.position.x = val;
					});
				folder3
					.add(settings, "Joint Diameter", 0.1, 5, 0.1)
					.listen()
					.onChange(function (val) {
						for (let i = 0; i < 6; i++) {
							legParts[i][0].scale.set(val * 1.5, 1.25, val * 1.5);
							legParts[i][1].scale.set(val, val, 1);
							legParts[i][3].scale.set(val, val, 1);
							legParts[i][5].scale.set(val, val, 1);
						}
					});
				folder3
					.add(settings, "Leg Diameter", 0.1, 5, 0.1)
					.listen()
					.onChange(function (val) {
						for (let i = 0; i < 6; i++) {
							legParts[i][2].scale.set(val, val);
							legParts[i][4].scale.set(val, val);
						}
					});

				folder1.open();
				folder2.open();
			}

			// Control Panel Variables
			let animateModel = true;

			// Legs
			/*
										 Back
						           (5)         (0)
						             \  _____  /
						              \/     \/
						         (4)___|     |___(1)
						               |     |
						              /\__↓__/\
						             /         \
						           (3)         (2)
										Front
						*/
			// Parts:
			// 0 = pivot
			// 1 = hip
			// 2 = femur
			// 3 = knee
			// 4 = tibia
			// 5 = foot

			// Groups:
			// legGroup[i][0] = (Tibia, Foot)
			// legGroup[i][1] = (Hip, Femur, Knee, legGroup[i][0])
			// legGroup[i][2] = (Pivot, legGroup[i][1])

			function generateLegs(hipDis) {
				// Add an object to each leg to represent the center of the gait during operation -CHANGEME!
				const jointNames = ["Pivot", "Hip", "Femur", "Knee", "Tibia", "Foot"];
				const legGeometrySpecs = [
					{ color: "yellow", rotate: false }, // Pivot
					{ color: "red", rotate: true }, // Hip
					{ color: "purple", rotate: true }, // Femur
					{ color: "blue", rotate: true }, // Knee
					{ color: "purple", rotate: true }, // Tibia
					{ color: "blue", rotate: true }, // Foot
				];
				const legPositions = [
					{ x: hipStance[0][0] / 2, z: hipStance[0][1] },
					{ x: hipStance[1][0] / 2, z: hipStance[1][1] },
					{ x: hipStance[2][0] / 2, z: hipStance[2][1] },
					{ x: -hipStance[2][0] / 2, z: hipStance[2][1] },
					{ x: -hipStance[1][0] / 2, z: hipStance[1][1] },
					{ x: -hipStance[0][0] / 2, z: hipStance[0][1] },
				];

				legGroups = [];
				legParts = [];
				goals = [];

				const createJoint = (spec) => {
					const geometry = new THREE.CylinderGeometry(1, 1, 1, 32);
					if (spec.rotate) geometry.rotateX(Math.PI * 0.5);
					const material = new THREE.MeshPhongMaterial({ color: spec.color });
					return new THREE.Mesh(geometry, material);
				};

				const createGroup = (name) => {
					const group = new THREE.Group();
					group.name = name;
					return group;
				};

				const setLegScale = (leg) => {
					const scales = [
						[0.75, 1.25, 0.75], // Pivot
						[0.5, 0.5, 1], // Hip
						[0.25, 0.25, 5], // Femur
						[0.5, 0.5, 1], // Knee
						[0.25, 0.25, 5], // Tibia
						[0.5, 0.5, 1], // Foot
					];
					scales.forEach((scale, index) => leg[index].scale.set(...scale));
				};

				const createLabel = (text) => {
					const canvas = document.createElement("canvas");
					const context = canvas.getContext("2d");
					context.font = "48px Arial";
					context.fillStyle = "white";
					context.fillText(text, 0, 50);

					const texture = new THREE.CanvasTexture(canvas);
					const material = new THREE.SpriteMaterial({ map: texture });
					const sprite = new THREE.Sprite(material);
					sprite.scale.set(5, 2.5, 1);
					return sprite;
				};

				for (let i = 0; i < 6; i++) {
					const objectArray = legGeometrySpecs.map((spec, index) => {
						const joint = createJoint(spec);
						joint.name = `${jointNames[index]} | Leg ${i}`;
						return joint;
					});

					legParts.push(objectArray);
					setLegScale(objectArray);

					const [pivot, hip, femur, knee, tibia, foot] = objectArray;

					const group0 = createGroup(`Group 0 | Leg ${i}`);
					group0.add(tibia, foot);
					group0.position.x = femurLen;

					const group1 = createGroup(`Group 1 | Leg ${i}`);
					group1.add(hip, femur, knee, group0);
					group1.position.y += hipDis;
					group1.position.x += coxaLen;

					const group2 = createGroup(`Group 2 | Leg ${i}`);
					group2.add(pivot, group1);

					// Add label for each leg
					const label = createLabel(`#${i}`);
					label.position.set(0, 2, 0);
					group2.add(label);

					legGroups.push([group0, group1, group2]);

					femur.position.x = femurLen / 2;
					knee.position.x = tibiaLen;
					tibia.position.x = tibiaLen / 2;
					foot.position.x = tibiaLen;
					let temp = new THREE.Vector3();
					knee.getWorldPosition(temp);
					femur.lookAt(temp);
					foot.getWorldPosition(temp);
					tibia.lookAt(temp);

					if (i > 2) group2.rotation.y += Math.PI;

					scene.add(group2);

					group2.position.set(
						legPositions[i].x,
						chassisHeight,
						legPositions[i].z
					);

					// Give the legs a default position
					goals.push(
						i < 3
							? new THREE.Vector3(
									legParts[i][0].getWorldPosition(new THREE.Vector3()).x + 6,
									0,
									legParts[i][0].getWorldPosition(new THREE.Vector3()).z
							  )
							: new THREE.Vector3(
									legParts[i][0].getWorldPosition(new THREE.Vector3()).x - 6,
									0,
									legParts[i][0].getWorldPosition(new THREE.Vector3()).z
							  )
					);
				}
			}

			const gaitBDC = (index, gaitOffset = [6, 0, 0]) => {
				// Returns the offset Position of the gait BDC (Bottom Dead Center) for a given leg index.
				// index = leg #, gaitOffset = offset from the leg pivot to the gait
				// center point.
				let indexPos = legGroups[index][2].getWorldPosition(
					new THREE.Vector3()
				);

				let gaitCenterPoint =
					index < 3
						? new THREE.Vector3(
								indexPos.x + gaitOffset[0],
								indexPos.y + gaitOffset[1],
								indexPos.z + gaitOffset[2]
						  )
						: new THREE.Vector3(
								indexPos.x - gaitOffset[0],
								indexPos.y + gaitOffset[1],
								indexPos.z + gaitOffset[2]
						  );
				return gaitCenterPoint;
			};

			/****	Note	*****

			To convert the inverse kinematics function to
			use world coordinates, I need to simply make
			an array, or helper function to get the required
			x,y,z offset to each leg. -CHANGEME!

			********************/

			// Inverse kinematics
			const calcAngles = () => {
				jointAngles = goals.map((goal, i) => {
					const pivotPosition = legParts[i][0].getWorldPosition(
						new THREE.Vector3()
					);
					const hipPosition = legParts[i][1].getWorldPosition(
						new THREE.Vector3()
					);

					// Calculate the distance from the pivot to the goal
					const xDistance = goal.x - pivotPosition.x;
					const zDistance = goal.z - pivotPosition.z;
					const rise = pivotPosition.y - goal.y;
					const pivotToGoal = Math.sqrt(
						xDistance ** 2 + zDistance ** 2 + rise ** 2
					);

					// Calculate the angle of the coxa rotation
					const theta = Math.atan2(zDistance, xDistance);

					// Calculate the effective distance from the hip to the goal
					const effectiveGoalX = goal.x - coxaLen * Math.cos(theta);
					const effectiveGoalZ = goal.z - coxaLen * Math.sin(theta);
					const effectiveGoal = new THREE.Vector3(
						effectiveGoalX,
						goal.y,
						effectiveGoalZ
					);
					const hipToGoalDistance = effectiveGoal.distanceTo(hipPosition);

					// Adjust goal if out of bounds
					if (hipToGoalDistance > femurLen + tibiaLen) {
						effectiveGoal.lerp(
							hipPosition,
							1 - (femurLen + tibiaLen - 0.001) / hipToGoalDistance
						);
					}

					// Calculate distances and angles
					const adjustedXDistance = effectiveGoal.x - hipPosition.x;
					const adjustedZDistance = effectiveGoal.z - hipPosition.z;
					const adjustedRise = hipPosition.y - effectiveGoal.y;
					const h = Math.sqrt(adjustedXDistance ** 2 + adjustedZDistance ** 2);
					const hipToGoal = Math.sqrt(h ** 2 + adjustedRise ** 2);

					const joint1 = Math.atan2(adjustedZDistance, adjustedXDistance); // Pivot joint angle
					const angleA = Math.atan(adjustedRise / h);
					const angleB = Math.acos(
						(hipToGoal ** 2 + femurLen ** 2 - tibiaLen ** 2) /
							(2 * hipToGoal * femurLen)
					);
					const joint2 = angleB - angleA; // Hip joint angle
					const joint3 = Math.acos(
						(femurLen ** 2 + tibiaLen ** 2 - hipToGoal ** 2) /
							(2 * femurLen * tibiaLen)
					); // Knee joint angle

					return [joint1, joint2, joint3];
				});
			};

			const updateAssembly = () => {
				// Can be left alone
				legGroups.forEach((group, i) => {
					const [tibiaGroup, hipGroup, pivotGroup] = group;
					const [joint1, joint2, joint3] = jointAngles[i];

					// Update rotations
					tibiaGroup.rotation.z = joint3 - Math.PI;
					hipGroup.rotation.z = joint2;
					pivotGroup.rotation.y = joint1;
				});
			};

			/***	Center Point Test Shape	   ***/
			const centerPoint = new THREE.Mesh(
				new THREE.SphereGeometry(0.25, 32, 32),
				new THREE.MeshBasicMaterial({
					color: 0xffffff,
					name: "Debug Shape",
				})
			);
			scene.add(centerPoint);

			/***********************************************************/
			//	Startup  //

			var defaultStepDis = 5;
			var defaultStepHeight = 4;
			let chassisHeight = 3.5;

			generateLegs(1);
			calcAngles();
			updateAssembly();

			/***********************************************************/

			// try to use an Object3D as the gait control points. This
			// will allow the use of Three.js functions. -CHANGEME!

			// Bezier curve control points

			let gaitCenterPoints = [],
				gaitStartPoints = [],
				gaitEndPoints = [];

			for (let i = 0; i < 6; i++) {
				gaitCenterPoints[i] = new THREE.Object3D().position.set(
					gaitBDC(i).x,
					gaitBDC(i).y,
					gaitBDC(i).z
				);

				gaitStartPoints[i] = new THREE.Object3D().position.set(
					gaitBDC(i).x,
					gaitBDC(i).y,
					gaitBDC(i).z + 5 / 2
				);

				gaitEndPoints[i] = new THREE.Object3D().position.set(
					gaitBDC(i).x,
					gaitBDC(i).y,
					gaitBDC(i).z - 5 / 2
				);
			}

			// let start = new THREE.Vector3(6, 0, 5);
			// let end = new THREE.Vector3(6, 0, -5);
			// let control = new THREE.Vector3(6, 4, 0);
			// let calcX, calcY, calcZ;
			// let startOrigin = start.clone();
			// let endOrigin = end.clone();

			class Gait {
				constructor(name, offsets, maxSpeed, stepDis, stepHeight, speed) {
					this.name = name;
					this.offsets = offsets;
					this.maxSpeed = maxSpeed;
					this.onGround = Array(6).fill(true);
					this.centerPoint = new THREE.Vector3();
					this.stabilityPolygon = [];
					this.debugShapePos = 0;
					this.debugShape = this.initDebugShape();
					this.initStabilityPolygon();

					/*** Movement Parameters ***/
					this.stepDis = stepDis;
					this.stepHeight = stepHeight;
					this.straifAngle = 0;
					this.turnThreshold = 0;
					// this.turnRadius = 0;
					this.turnPoint = new THREE.Vector3();
					this.speed = speed;
				}

				initDebugShape() {
					const debugShape = new THREE.Mesh(
						new THREE.SphereGeometry(0.75, 32, 32),
						new THREE.MeshBasicMaterial({
							color: 0xffff00,
							transparent: true,
							opacity: 0,
							name: "Debug Shape",
						})
					);
					scene.add(debugShape);
					return debugShape;
				}

				updateDebugShape() {
					let tempVect = new THREE.Vector3();
					legParts[this.debugShapePos][5].getWorldPosition(tempVect);
					this.debugShape.position.set(tempVect.x, tempVect.y, tempVect.z);
				}

				initStabilityPolygon() {
					const tempArray = [];
					const worldPos = new THREE.Vector3();
					legParts.forEach((leg, i) => {
						leg[5].getWorldPosition(worldPos);
						tempArray.push(new THREE.Vector2(worldPos.x, worldPos.z));
					});

					this.stabShape = new THREE.Shape(tempArray);
					this.stabGeo = new THREE.ShapeGeometry(this.stabShape);
					this.stabGeo.name = "Stability Polygon Geometry";

					this.stabMat = new THREE.MeshBasicMaterial({
						color: 0x990000,
						transparent: true,
						opacity: 0.35,
						side: THREE.DoubleSide,
						name: "Stability Shape Mesh",
					});

					this.stabMesh = new THREE.Mesh(this.stabGeo, this.stabMat);
					this.stabMesh.rotateX(Math.PI / 2);
					scene.add(this.stabMesh);
				}

				updateWalkCycle() {
					const gaitRatio = 1 - 4 / 6;

					function calculateGaitCenterPoint(control, legID) {
						const legPosition = legParts[legID][0].getWorldPosition(
							new THREE.Vector3()
						);
						return new THREE.Vector3(
							(control.x + Math.abs(legPosition.x)) * Math.sign(legPosition.x),
							0,
							legPosition.z
						);
					}
					// Function to calculate arc length, end point, and subtended angle
					// function calcArcPoint(turnPoint, r, d, gaitCenterPoint) {
					// 	// Step 1: Calculate the subtended angle (theta_arc)
					// 	const theta_arc = 2 * Math.asin(d / (2 * r));

					// 	// Step 2: Calculate the starting angle (theta_start)
					// 	const theta_start = Math.atan2(
					// 		gaitCenterPoint.z - turnPoint.z,
					// 		gaitCenterPoint.x - turnPoint.x
					// 	);

					// 	// Step 3: Calculate the ending angle (theta_end)
					// 	const theta_end = theta_start + theta_arc;

					// 	// Step 4: Calculate the end point coordinates (x_end, y_end)
					// 	const x_end = turnPoint.x + r * Math.cos(theta_end);
					// 	const z_end = turnPoint.z + r * Math.sin(theta_end);

					// 	// Return results
					// 	return {
					// 		x: x_end,
					// 		z: z_end,
					// 	};
					// }

					if (
						this.turnThreshold > 99 ||
						this.turnThreshold < -99 ||
						this.turnThreshold == 0
					) {
						this.turnPoint = new THREE.Vector3(100, 0, 0);
					}

					legGroups.forEach((_, i) => {
						if (this.offsets[i] > 1000) this.offsets[i] = 0;

						const straif = this.straifAngle;

						// Recalculate positions of start and end positions
						// based on the straif angle.

						let startOrigin = gaitCenterPoints[i];
						startOrigin.y = 0;
						let endOrigin = gaitCenterPoints[i];
						endOrigin.y = 0;

						gaitStartPoints[i].x =
							Math.cos(straif) * (startOrigin.x - gaitCenterPoints[i].x) +
							Math.sin(straif) * (startOrigin.z - 2.5 - gaitCenterPoints[i].z) +
							gaitCenterPoints[i].x;

						gaitStartPoints[i].z =
							Math.sin(straif) * (startOrigin.x - gaitCenterPoints[i].x) -
							Math.cos(straif) * (startOrigin.z - 2.5 - gaitCenterPoints[i].z) +
							gaitCenterPoints[i].z;

						gaitEndPoints[i].x =
							Math.cos(straif) * (endOrigin.x - gaitCenterPoints[i].x) +
							Math.sin(straif) * (endOrigin.z + 2.5 - gaitCenterPoints[i].z) +
							gaitCenterPoints[i].x;
						gaitEndPoints[i].z =
							Math.sin(straif) * (endOrigin.x - gaitCenterPoints[i].x) -
							Math.cos(straif) * (endOrigin.z + 2.5 - gaitCenterPoints[i].z) +
							gaitCenterPoints[i].z;

						const calcedRatio = this.offsets[i] / (points / 2);
						const isGrounded = calcedRatio > 2 * gaitRatio;
						const calcedOffset = isGrounded
							? mapVal(calcedRatio, 2 * gaitRatio, 2, 1, 2)
							: mapVal(calcedRatio, 0, 2 * gaitRatio, 0, 1);

						// function calcPointOnGroundArc(start, end, center, t) {
						// 	// Just cuz
						// 	t--;

						// 	const tempVect = new THREE.Vector3();

						// 	legParts[i][0].getWorldPosition(tempVect);

						// 	//Kinda works. Should make better use of world coordinates though...
						// 	if (i < 3) {
						// 		center[0] = center[0] - tempVect.x;
						// 		center[1] = center[1] - tempVect.z;
						// 	} else {
						// 		center[0] = center[0] + tempVect.x;
						// 		center[1] = center[1] + tempVect.z;
						// 	}

						// 	const startAngle = Math.atan2(
						// 		start[1] - center[1],
						// 		start[0] - center[0]
						// 	);
						// 	let endAngle = Math.atan2(end[1] - center[1], end[0] - center[0]);

						// 	// Ensure angle continuity
						// 	if (endAngle < startAngle) {
						// 		endAngle += 2 * Math.PI;
						// 	}

						// 	const angle = (1 - t) * endAngle + t * startAngle;

						// 	const radius = Math.sqrt(
						// 		(start[0] - center[0]) ** 2 + (start[1] - center[1]) ** 2
						// 	);

						// 	const x = center[0] + radius * Math.cos(angle);
						// 	const y = center[1] + radius * Math.sin(angle);

						// 	return [x, y];
						// }
						const calcPointOnGround = (p1, p2, p3) =>
							(calcedOffset - 1) * (calcedOffset - 1) * p1 +
							2 * (calcedOffset - 1) * (1 - (calcedOffset - 1)) * p2 +
							(1 - (calcedOffset - 1)) * (1 - (calcedOffset - 1)) * p3;
						const calcPoint = (p1, p2, p3) =>
							(1 - calcedOffset) * (1 - calcedOffset) * p1 +
							2 * (1 - calcedOffset) * calcedOffset * p2 +
							calcedOffset * calcedOffset * p3;
						const calcPointY = () =>
							2 * (1 - calcedOffset) * calcedOffset * (this.stepHeight * 2) +
							calcedOffset ** 2 * 0;

						let calcX = isGrounded
							? calcPointOnGround(
									gaitStartPoints[i].x,
									gaitCenterPoints[i].x,
									gaitEndPoints[i].x
							  )
							: calcPoint(
									gaitStartPoints[i].x,
									gaitCenterPoints[i].x,
									gaitEndPoints[i].x
							  );

						let calcZ = isGrounded
							? calcPointOnGround(
									gaitStartPoints[i].z,
									gaitCenterPoints[i].z,
									gaitEndPoints[i].z
							  )
							: calcPoint(
									gaitStartPoints[i].z,
									gaitCenterPoints[i].z,
									gaitEndPoints[i].z
							  );

						// console.log(
						// 	i,
						// 	gaitStartPoints[i],
						// 	gaitCenterPoints[i],
						// 	gaitEndPoints[i],
						// 	legParts[i][5].getWorldPosition(new THREE.Vector3())
						// );

						const calcY = isGrounded ? 0 : calcPointY();

						goals[i].set(calcX, calcY, calcZ);
						legParts[i][5].material.color.set(isGrounded ? "blue" : "red");

						this.offsets[i] += 5;
						this.onGround[i] = isGrounded;
					});

					this.updateDebugShape();
				}

				checkStability() {
					this.stabilityPolygon = [];

					const onGroundCount = this.onGround.reduce(
						(count, isGrounded) => count + (isGrounded ? 1 : 0),
						0
					);

					if (onGroundCount < 3) console.warn("Less than 3 points of contact!");

					this.onGround.forEach((isGrounded, i) => {
						if (isGrounded) {
							const worldPos = new THREE.Vector3();
							legParts[i][5].getWorldPosition(worldPos);
							this.stabilityPolygon.push(worldPos.x, 0, worldPos.z);
						}
					});

					this.isStable();
				}

				isStable() {
					const numPoints = this.stabilityPolygon.length;
					let p1 = this.stabilityPolygon[0];
					let stable = false;

					for (let i = 1; i <= numPoints; i++) {
						const p2 = this.stabilityPolygon[i % numPoints];
						if (
							this.centerPoint.z > Math.min(p1[1], p2[1]) &&
							this.centerPoint.z <= Math.max(p1[1], p2[1]) &&
							this.centerPoint.x <= Math.max(p1[0], p2[0])
						) {
							const xIntersection =
								((this.centerPoint.z - p1[0]) * (p2[1] - p1[1])) /
									(p2[0] - p1[0]) +
								p1[1];
							stable = p1[1] === p2[1] || this.centerPoint.x <= xIntersection;
						}
						p1 = p2;
					}

					this.stable = stable;
				}

				visualizeStability() {
					const vectArray = this.getLegWorldPositions2D();
					this.interpolateOffGroundLegs(vectArray);
					this.updateStabilityMesh(vectArray);
				}

				getLegWorldPositions2D() {
					return legParts.map((leg) => {
						const tempPos = new THREE.Vector3();
						leg[5].getWorldPosition(tempPos);
						return new THREE.Vector2(tempPos.x, tempPos.z);
					});
				}

				interpolateOffGroundLegs(vectArray) {
					const tempPos = new THREE.Vector3();
					const pointA = new THREE.Vector2();
					const pointB = new THREE.Vector2();

					for (let i = 0; i < 6; i++) {
						if (!this.onGround[i]) {
							const downIndex = this.findAdjacentGroundLeg(i, -1);
							const upIndex = this.findAdjacentGroundLeg(i, 1);

							legParts[downIndex][5].getWorldPosition(tempPos);
							pointA.set(tempPos.x, tempPos.z);

							legParts[upIndex][5].getWorldPosition(tempPos);
							pointB.set(tempPos.x, tempPos.z);

							vectArray[i].lerpVectors(pointA, pointB, 0.5);
						}
					}
				}

				findAdjacentGroundLeg(index, direction) {
					let offset = 0;
					while (!this.onGround[(index + direction * offset + 6) % 6]) {
						offset++;
					}
					return (index + direction * offset + 6) % 6;
				}

				updateStabilityMesh(vectArray) {
					const positions = vectArray.flatMap(({ x, y }) => [x, y, 0]);
					const f32Array = new Float32Array(positions);

					this.stabMesh.geometry.attributes.position.array = f32Array;
					this.stabMesh.geometry.attributes.position.needsUpdate = true;
				}
			}

			const mapVal = (value, fromMin, fromMax, toMin, toMax) =>
				((value - fromMin) * (toMax - toMin)) / (fromMax - fromMin) + toMin;

			/***	Default starting values for gait	***/

			let points = 1000;
			const rippleGait = new Gait(
				"ripple",
				[
					(points / 6) * 0,
					(points / 6) * 4,
					(points / 6) * 2,
					(points / 6) * 5,
					(points / 6) * 1,
					(points / 6) * 3,
				],
				1,
				defaultStepDis,
				defaultStepHeight,
				0
			);

			let currentGait = rippleGait;

			// When given an object, this class will visualize the path of the object
			// as it moves through space with a line.
			class PathVisualizer {
				constructor(object, scene, maxPoints = 1000, color = 0xfff0000) {
					this.object = object;
					this.scene = scene;
					this.maxPoints = maxPoints;
					this.color = color;
					this.positions = new Float32Array(this.maxPoints * 3);
					this.index = 0;

					const geometry = new THREE.BufferGeometry();
					geometry.setAttribute(
						"position",
						new THREE.BufferAttribute(this.positions, 3)
					);

					const material = new THREE.LineBasicMaterial({
						color: color,
					});

					this.line = new THREE.Line(geometry, material);

					// Start the line at the object's current position
					this.reset();

					this.scene.add(this.line);
				}

				// Update the line positions.
				update() {
					if (this.line.visible) {
						const position = new THREE.Vector3();
						this.object.getWorldPosition(position);

						// Shift positions to the left.
						for (let i = 0; i < this.maxPoints - 1; i++) {
							this.positions[i * 3] = this.positions[(i + 1) * 3];
							this.positions[i * 3 + 1] = this.positions[(i + 1) * 3 + 1];
							this.positions[i * 3 + 2] = this.positions[(i + 1) * 3 + 2];
						}

						// Set the last position to the current position.
						this.positions[(this.maxPoints - 1) * 3] = position.x;
						this.positions[(this.maxPoints - 1) * 3 + 1] = position.y;
						this.positions[(this.maxPoints - 1) * 3 + 2] = position.z;

						this.line.geometry.attributes.position.needsUpdate = true;
					}
				}

				changeObject(object) {
					this.object = object;
					this.reset();
				}

				hide() {
					//Hides the line from view.
					this.line.visible = false;
				}

				show() {
					this.line.visible = true;
					this.reset();
				}

				reset() {
					for (let i = 0; i < this.maxPoints; i++) {
						const worldPosition = new THREE.Vector3();
						this.object.getWorldPosition(worldPosition);
						this.positions[i * 3] = worldPosition.x;
						this.positions[i * 3 + 1] = worldPosition.y;
						this.positions[i * 3 + 2] = worldPosition.z;
					}
				}
			}

			// Initialize the object path visualizer on the foot of leg 0.
			const footVisualizer = new PathVisualizer(legParts[0][5], scene, 250);

			// Render Loop.
			let render = function () {
				requestAnimationFrame(render);

				if (animateModel) {
					calcAngles();
					updateAssembly();

					rippleGait.updateWalkCycle();
					rippleGait.checkStability();
					rippleGait.visualizeStability();

					footVisualizer.update();

					// console.log(goals);
				}

				// Render the scene
				renderer.render(scene, camera);
			};

			render();
		</script>

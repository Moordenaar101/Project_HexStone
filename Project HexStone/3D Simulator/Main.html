<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hexapod</title>
		<link rel="stylesheet" href="styling.css" />

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"ImportControls": "../examples/jsm/controls/OrbitControls.js",
					"ImportMath": "../src/math/MathUtils.js",
					"three/addons/": "../examples/jsm/",
					"ImportMeshline": "../THREE.MeshLine-master/THREE.MeshLine-master/src/THREE.MeshLine.js"
				}
			}
		</script>

		<script type="module">
			// ------------------------------------------------
			// BASIC SETUP
			// ------------------------------------------------

			import * as THREE from "three";
			import { OrbitControls } from "ImportControls";
			import { MathUtils } from "ImportMath";
			import { GUI } from "three/addons/libs/lil-gui.module.min.js";
			import { init, camera, scene, renderer } from "./SceneSetup.js";
			import { setupControlPannel } from "./ControlPanel.js";
			import { generateLegs } from "./LegGenerator.js";
			import { Gait } from "./Gait.js";
			import { PathVisualizer } from "./PathVisualizer.js";
			import { calcAngles, updateAssembly } from "./InverseKinematics.js";
			import {
				gaitBDC,
				buildGoals,
				mapVal,
				DebuggingObject,
			} from "./HexapodUtils.js";

			init();

			// ------------------------------------------------
			// Global Paramerters
			// ------------------------------------------------

			// Initialize leg parameters and variables
			let femur, tibia, hip, knee, foot, endPoint, pivot;
			const coxaLen = 1;
			const femurLen = 5;
			const tibiaLen = 5;
			const numLegs = 6;
			let legGroups = [],
				legParts = [],
				goals = [];
			let hipStance = [
				[12, 10],
				[18, 0],
				[12, -10],
			];

			// Runtime Variables
			let hipWorldPos;
			let goalWorldPos = [0, 0, 0, 0, 0, 0];
			let jointAngles = [];
			const hipDis = 0.8;

			// ------------------------------------------------
			// Setup Functions
			// ------------------------------------------------

			// Control Panel Variables
			let animateModel = true;

			/***	Center Point Test Shape	   ***/
			const centerPoint = new THREE.Mesh(
				new THREE.SphereGeometry(0.25, 32, 32),
				new THREE.MeshBasicMaterial({
					color: 0xffffff,
					name: "Debug Shape",
				})
			);
			scene.add(centerPoint);

			//	Startup  //
			var defaultStepDis = 5;
			var defaultStepHeight = 4;
			let chassisHeight = 3.5;

			({ legGroups, legParts } = generateLegs(
				scene,
				hipStance,
				chassisHeight,
				coxaLen,
				femurLen,
				tibiaLen,
				hipDis
			));
			goals = buildGoals(legGroups);
			jointAngles = calcAngles(goals, legParts, coxaLen, femurLen, tibiaLen);
			legGroups = updateAssembly(legGroups, jointAngles);

			// Bezier curve control points

			let gaitCenterPoints = [],
				gaitStartPoints = [],
				gaitEndPoints = [];

			// console.log("Leg Groups: ", legGroups);

			for (let i = 0; i < 6; i++) {
				gaitCenterPoints[i] = new THREE.Object3D().position.set(
					gaitBDC(i, legGroups).x,
					gaitBDC(i, legGroups).y,
					gaitBDC(i, legGroups).z
				);

				gaitStartPoints[i] = new THREE.Object3D().position.set(
					gaitBDC(i, legGroups).x,
					gaitBDC(i, legGroups).y,
					gaitBDC(i, legGroups).z + 5 / 2
				);

				gaitEndPoints[i] = new THREE.Object3D().position.set(
					gaitBDC(i, legGroups).x,
					gaitBDC(i, legGroups).y,
					gaitBDC(i, legGroups).z - 5 / 2
				);
			}

			let newgaitStartPoints = [0, 0, 0, 0, 0, 0];
			let newgaitEndPoints = [0, 0, 0, 0, 0, 0];

			// Example usage of mapVal
			newgaitStartPoints = newgaitStartPoints.map((point, index) =>
				mapVal(point, 0, 100, gaitStartPoints[index].x, gaitEndPoints[index].x)
			);

			newgaitEndPoints = newgaitEndPoints.map((point, index) =>
				mapVal(point, 0, 100, gaitStartPoints[index].y, gaitEndPoints[index].y)
			);

			/***	Default starting values for gait	***/

			let points = 1000;
			const rippleGait = new Gait(
				"ripple",
				[
					(points / 6) * 0,
					(points / 6) * 4,
					(points / 6) * 2,
					(points / 6) * 5,
					(points / 6) * 1,
					(points / 6) * 3,
				],
				1,
				defaultStepDis,
				defaultStepHeight,
				0
			);

			let currentGait = rippleGait;

			// Initialize the object path visualizer on the foot of leg 0.
			const footVisualizer = new PathVisualizer(legParts[0][5], scene, 250);

			setupControlPannel(legGroups, legParts, currentGait, footVisualizer);

			// Render Loop.
			let render = function () {
				requestAnimationFrame(render);
				if (animateModel) {
					jointAngles = calcAngles(
						goals,
						legParts,
						coxaLen,
						femurLen,
						tibiaLen
					);
					legGroups = updateAssembly(legGroups, jointAngles);

					goals = rippleGait.updateWalkCycle(
						legGroups,
						legParts,
						points,
						goals
					);

					// rippleGait.checkStability();
					// rippleGait.visualizeStability();

					footVisualizer.update();
				}
				// Render the scene
				renderer.render(scene, camera);
			};

			render();
		</script>
	</head>
</html>
